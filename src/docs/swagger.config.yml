openapi: 3.0.3
info:
  title: Pokedex API
  version: 1.0.0
  description: |
    API REST pour la gestion d'authentification et la consultation des cartes.
servers:
  - url: http://localhost:3001
    description: Local development
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required:
        - id
        - email
        - username
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: trainer@pokedex.com
        username:
          type: string
          example: red
    Card:
      type: object
      required:
        - id
        - name
        - pokedexNumber
      properties:
        id:
          type: integer
          example: 25
        name:
          type: string
          example: Pikachu
        pokedexNumber:
          type: integer
          example: 25
    Deck:
      type: object
      required:
        - id
        - name
        - userId
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Deck Electrik
        userId:
          type: integer
          example: 1
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Internal server error
    AuthRequestSignUp:
      type: object
      required:
        - email
        - username
        - password
      properties:
        email:
          type: string
          format: email
          example: trainer@pokedex.com
        username:
          type: string
          example: blue
        password:
          type: string
          minLength: 1
          example: superSecret123
    AuthRequestSignIn:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: trainer@pokedex.com
        password:
          type: string
          minLength: 1
          example: superSecret123
    AuthResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'
tags:
  - name: Auth
    description: Endpoints d'authentification
  - name: Card
    description: Endpoints de consultation des cartes
  - name: Deck
    description: Endpoints de deck (module prêt pour extension)
paths: {}
