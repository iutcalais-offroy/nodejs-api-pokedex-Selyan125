paths:
  /api/health:
    get:
      tags:
        - Deck
      summary: Vérification de santé de l'API
      description: Endpoint de health-check pour vérifier que le service est opérationnel.
      responses:
        '200':
          description: Service disponible
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: TCG Backend Server is running

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
